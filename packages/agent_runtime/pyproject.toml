[project]
name = "agent_runtime"
version = "0.1.0"
description = "Agent harness: Executor interface, OpenCode adapter, sandbox runtime, session logs"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28", "pydantic>=2.14.1", "pydantic-settings>=2.6"]

[dependency-groups]
dev = ["httpx2>=2.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]
