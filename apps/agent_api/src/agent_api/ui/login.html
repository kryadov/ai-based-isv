<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI-Native ISV — sign in</title>
  <link rel="stylesheet" href="/ui/static/styles.css">
</head>
<body class="login">
  <main class="login-card">
    <h1>AI-Native ISV</h1>
    <p class="muted">Organization panel — humans only. Agents are service identities.</p>
    <form id="login-form" method="post" action="/ui/login">
      <label>Username <input name="username" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Sign in</button>
    </form>
    <p class="error">{{error}}</p>
  </main>
</body>
</html>
