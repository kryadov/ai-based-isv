[project]
name = "agent_api"
version = "0.1.0"
description = "Swarm control plane API: task queue, leases, HITL inbox, audit"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.34"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_api"]
