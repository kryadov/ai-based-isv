[project]
name = "bootstrap"
version = "0.1.0"
description = "Interactive organization bootstrapper: questionnaire, L0 provisioning, project repo seeding"
requires-python = ">=3.12"
dependencies = ["typer>=0.15", "pyyaml>=6"]

[dependency-groups]
dev = ["types-pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bootstrap"]

[project.scripts]
org-bootstrap = "bootstrap.cli:app"
