# Gitea: git+PR+CI+OCI-registry. NodePort 30080 (HTTP), 30022 (SSH).
# DB: external CNPG Cluster postgres-platform (values-external-db.yaml); built-in bitnami subcharts disabled.
gitea:
  admin:
    username: swarm-admin
    email: swarm-admin@lab.local
    password: ""
    # password is generated in bootstrap (kubectl exec) and stored in Vault
  config:
    repository:
      ENABLE_PUSH_CREATE_USER: "true"
    server:
      ROOT_URL: "http://localhost:30080/"
      DOMAIN: "localhost"
      SSH_DOMAIN: "localhost"
      SSH_PORT: "30022"
    actions:
      ENABLED: "true"
service:
  http:
    type: NodePort
    nodePort: 30080
  ssh:
    type: NodePort
    nodePort: 30022
postgresql:
  enabled: false
postgresql-ha:
  enabled: false
persistence:
  enabled: true
  size: 5Gi
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 768Mi
