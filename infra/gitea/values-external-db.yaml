# External DB: CNPG Cluster postgres-platform (apply on top of values.yaml).
# The password is passed by the bootstrapper via --set gitea.config.database.PASSWD (read from secret postgres-platform-app).
gitea:
  config:
    database:
      DB_TYPE: postgres
      HOST: postgres-platform-rw.platform.svc.cluster.local:5432
      NAME: gitea
      USER: gitea
