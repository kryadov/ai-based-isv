apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: swarm-lab
servers: 1
ports:
  - port: 30080:30080
    nodeFilters:
      - loadbalancer
  - port: 30022:30022
    nodeFilters:
      - loadbalancer
  - port: 30081:30081
    nodeFilters:
      - loadbalancer
  - port: 30082:30082
    nodeFilters:
      - loadbalancer
options:
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
