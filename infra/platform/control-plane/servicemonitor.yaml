# Prometheus scrapes the control-plane /metrics (runs, vertices, merges).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agent-api
  labels: {app: agent-api}
spec:
  selector:
    matchLabels: {app: agent-api}
  endpoints:
    - {port: http, path: /metrics, interval: 30s}
