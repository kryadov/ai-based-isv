# Control plane (M11): agent_api + the panel in namespace platform.
# The image tag is set per deploy by `platform.sh up` through the Argo CD
# Application's kustomize image override (swarm-platform:<sha7>).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform
resources:
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml
