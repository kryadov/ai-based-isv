# Argo CD (GitOps control plane) — spec §6. UI behind NodePort without TLS (lab).
configs:
  # insecure = no TLS redirect (NodePort lab); chart v10 reads this from params
  params:
    "server.insecure": true
server:
  service:
    type: NodePort
    nodePortHttp: 30081
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
controller:
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 1Gi
redis:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
applicationSet:
  enabled: false
notifications:
  enabled: false
