# Application isv-product-prod (M6): the service's deploy/ dir in its Gitea repo
# (canonical copy, seeded by `org-bootstrap seed-demo`) → namespace prod.
# The platform deployer overrides spec.source.kustomize (image + patches) per
# rollout; Argo Rollouts runs the canary with analysis.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: isv-product-prod
  namespace: platform
spec:
  project: swarm-lab
  source:
    repoURL: http://gitea-http.platform.svc.cluster.local:3000/swarm-lab/isv-product.git
    targetRevision: main
    path: deploy
  destination:
    namespace: prod
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
