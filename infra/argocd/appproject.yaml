# AppProject — environment boundary (spec §7.2.6): sources and destinations white-list.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: swarm-lab
  namespace: platform
spec:
  description: "Swarm lab projects (target namespaces: prod, staging)"
  sourceRepos:
    - https://github.com/kryadov/ai-based-isv
  destinations:
    - namespace: prod
      server: https://kubernetes.default.svc
    - namespace: staging
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
