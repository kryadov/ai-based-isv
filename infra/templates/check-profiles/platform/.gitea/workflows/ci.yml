# Platform check profile: THIS repo through its own corridor (self-dev level 2,
# spec §13.7). Same structure and contexts as the python profile; the checks
# job runs the workspace gates exactly like the GitHub CI (.github/workflows).
# Agents cannot change this file (.gitea/** is a protected gate path).
# Supply chain: actions are pinned to commit SHAs and downloaded tools are
# checksum-verified.
name: ci
on:
  pull_request:
  push:
    branches: [main]

env:
  UV_VERSION: "0.13.8"
  GITLEAKS_VERSION: "8.28.0"
  SEMGREP_VERSION: "1.140.0"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The stand sets PLATFORM_GIT_URL (in-cluster Gitea): ROOT_URL is a host
          # NodePort that a job container cannot reach.
          github-server-url: ${{ vars.PLATFORM_GIT_URL || github.server_url }}
      - name: install uv (checksum-verified)
        run: |
          base="https://github.com/astral-sh/uv/releases/download/${UV_VERSION}"
          tarball="uv-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLO "$base/$tarball" && curl -fsSLO "$base/$tarball.sha256"
          sha256sum -c "$tarball.sha256"
          tar -xzf "$tarball" --strip-components=1 -C /usr/local/bin
          rm -f "$tarball" "$tarball.sha256"
      - name: sync
        run: uv sync --all-packages --locked
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy packages apps
      - name: pytest
        run: uv run pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          github-server-url: ${{ vars.PLATFORM_GIT_URL || github.server_url }}
      - name: install uv (checksum-verified)
        run: |
          base="https://github.com/astral-sh/uv/releases/download/${UV_VERSION}"
          tarball="uv-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLO "$base/$tarball" && curl -fsSLO "$base/$tarball.sha256"
          sha256sum -c "$tarball.sha256"
          tar -xzf "$tarball" --strip-components=1 -C /usr/local/bin
          rm -f "$tarball" "$tarball.sha256"
      - name: gitleaks (secret scan, checksum-verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o gitleaks-sums.txt
          grep " $tarball\$" gitleaks-sums.txt | sha256sum -c -
          tar -xzf "$tarball" -C /usr/local/bin gitleaks
          rm -f "$tarball" gitleaks-sums.txt
          gitleaks detect --no-git --redact --source .
      - name: semgrep (SAST)
        # semgrep 1.140.0 crashes on import with pydantic>=2.12.
        run: uvx --python 3.12 --with "pydantic<2.12" "semgrep==${SEMGREP_VERSION}" scan --config p/ci --error --metrics off .
