# Namespace-wide allowances (verified by the M4b spike, 2026-11-10, and the
# M4c MCP spike, 2026-11-12):
# egress — kube-dns, Gitea git-http (3000), LiteLLM (4000), and the in-namespace
# MCP servers (pods labelled component=mcp-server, port 8000); ingress — the
# opencode serve port 4096 (host worker drives the sandbox via a NodePort).
# Ingress to the MCP port is scoped to MCP pods only (netpol-mcp.yaml), so a
# sandbox cannot expose a listener on 8000. Everything else (including
# Postgres) stays denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agent-egress
  namespace: agents
  labels:
    app.kubernetes.io/part-of: agent-runtime
spec:
  podSelector: {}
  policyTypes:
    - Egress
    - Ingress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 4000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: mcp-server
      ports:
        - protocol: TCP
          port: 8000
  ingress:
    - ports:
        - protocol: TCP
          port: 4096
