# Namespace-wide allowances (verified by the M4b spike, 2026-11-10):
# egress — kube-dns, Gitea git-http (3000), LiteLLM (4000); ingress — the
# opencode serve port 4096 so the host worker can drive the sandbox via a
# NodePort. Everything else (including Postgres) stays denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agent-egress
  namespace: agents
  labels:
    app.kubernetes.io/part-of: agent-runtime
spec:
  podSelector: {}
  policyTypes:
    - Egress
    - Ingress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 4000
  ingress:
    - ports:
        - protocol: TCP
          port: 4096
