# Default deny: nothing enters or leaves the agents namespace unless an
# explicit allow policy admits it. Sandbox pods must be able to reach only
# Gitea (git clone), LiteLLM (model calls), and kube-dns.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: agents
  labels:
    app.kubernetes.io/part-of: agent-runtime
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
