# task-source MCP server (tracker = Gitea Issues, v0). In-cluster for sandbox
# pods (task-source.agents.svc:8000/mcp) and NodePort 30085 for the host worker's
# tracker status loop. The Gitea token comes from Secret mcp-task-source
# (created by section_mcp from OpenBao secret/gitea/admin).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-source
  namespace: agents
  labels: &labels
    app.kubernetes.io/name: task-source
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: agent-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: task-source
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      containers:
        - name: server
          image: mcp-servers:0.1.0
          imagePullPolicy: Never
          command: ["python", "-m", "mcp_servers.task_source"]
          env:
            - name: GITEA_BASE_URL
              value: http://gitea-http.platform.svc.cluster.local:3000
            - name: GITEA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-task-source
                  key: gitea-token
            - name: PORT
              value: "8000"
          ports:
            - containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 5
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: task-source
  namespace: agents
  labels:
    app.kubernetes.io/name: task-source
    app.kubernetes.io/component: mcp-server
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: task-source
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30085
