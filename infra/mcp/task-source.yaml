# task-source MCP server (tracker = Gitea Issues, v0) — the WRITE-capable variant.
# Reached ONLY by the host worker's tracker status loop via NodePort 30085: its
# ingress policy (netpol-mcp.yaml, allow-task-source-ingress) admits no pod, and
# it carries no sandbox-access label. Sandboxes read tasks through task-reader.
# The Gitea token comes from Secret mcp-task-source (section_mcp, from OpenBao).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-source
  namespace: agents
  labels: &labels
    app.kubernetes.io/name: task-source
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: agent-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: task-source
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      containers:
        - name: server
          image: mcp-servers:0.1.0
          imagePullPolicy: Never
          command: ["python", "-m", "mcp_servers.task_source"]
          env:
            - name: GITEA_BASE_URL
              value: http://gitea-http.platform.svc.cluster.local:3000
            - name: GITEA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-task-source
                  key: gitea-token
            - name: PORT
              value: "8000"
          ports:
            - containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 5
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: task-source
  namespace: agents
  labels:
    app.kubernetes.io/name: task-source
    app.kubernetes.io/component: mcp-server
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: task-source
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30085
