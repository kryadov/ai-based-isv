# LiteLLM gateway — single entry point for agent model access (spec §7.8).
# Models: external APIs only — the stand has no GPU, so no local inference.
# Primary: z.ai GLM Coding Plan (owner's subscription, OpenAI-compatible
# coding endpoint). OpenRouter (metered) is used ONLY after z.ai reports its
# plan limit (HTTP 429) — other z.ai errors are retried on z.ai and surface
# to the caller; see zai_limit_gate.py.
# The alias names are historical and kept stable: the acceptance flows
# (`litellm/qwen3`) and the llm MCP server address them.
#   qwen3      — the executor/agent model: must emit real OpenAI tool_calls.
#   qwen-coder — light model (gateway pings, short completions).
# Keys never live in git: .env → OpenBao `secret/litellm/{zai,openrouter}` →
# Secret `litellm-provider` (synced by section_litellm) → pod env.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: platform
data:
  config.yaml: |
    model_list:
      - model_name: qwen3
        litellm_params:
          model: openai/glm-5.3
          api_base: https://api.z.ai/api/coding/paas/v4
          api_key: os.environ/ZAI_API_KEY
      - model_name: qwen-coder
        litellm_params:
          model: openai/glm-5.3-flash
          api_base: https://api.z.ai/api/coding/paas/v4
          api_key: os.environ/ZAI_API_KEY
          # Light alias answers directly: with thinking on, short completions
          # (max_tokens=16 gateway checks) are spent on reasoning and come back empty.
          extra_body:
            thinking:
              type: disabled
      - model_name: qwen3-openrouter
        litellm_params:
          model: openrouter/z-ai/glm-5.3
          api_key: os.environ/OPENROUTER_API_KEY
      - model_name: qwen-coder-openrouter
        litellm_params:
          model: openrouter/deepseek/deepseek-v4.1-flash
          api_key: os.environ/OPENROUTER_API_KEY
      # Bot reviewer (M5): z.ai first like everything else (owner directive:
      # OpenRouter only on the plan limit). The limit-time fallback is a
      # different family (kimi) — cross-family review, research 2026-11-14.
      - model_name: reviewer
        litellm_params:
          model: openai/glm-5.3
          api_base: https://api.z.ai/api/coding/paas/v4
          api_key: os.environ/ZAI_API_KEY
      - model_name: reviewer-fallback
        litellm_params:
          model: openrouter/moonshotai/kimi-k3.1-pro
          api_key: os.environ/OPENROUTER_API_KEY
    # OpenRouter ONLY when the z.ai plan limit is exhausted (owner directive,
    # 2026-11-15). LiteLLM fallbacks fire on any error, so zai_limit_gate.py
    # disables them per request until z.ai answers 429; then z.ai is parked
    # for cooldown_time and the fallbacks below carry the traffic.
    router_settings:
      fallbacks:
        - qwen3: ["qwen3-openrouter"]
        - qwen-coder: ["qwen-coder-openrouter"]
        - reviewer: ["reviewer-fallback"]
      retry_policy:
        RateLimitErrorRetries: 0        # an exhausted plan: no point retrying
        DefaultRetries: 2               # transient z.ai errors: retry z.ai itself
      allowed_fails_policy:
        RateLimitErrorAllowedFails: 0   # the first 429 parks z.ai ...
        AuthenticationErrorAllowedFails: 1000
        BadRequestErrorAllowedFails: 1000
        TimeoutErrorAllowedFails: 1000
        InternalServerErrorAllowedFails: 1000
        ContentPolicyViolationErrorAllowedFails: 1000
      cooldown_time: 300                # ... for 5 min (= zai_limit_gate COOLDOWN_S)
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
    litellm_settings:
      drop_params: true
      callbacks: ["zai_limit_gate.gate"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-master
                  key: master-key
            # Either provider may be unset; section_litellm requires at least one.
            - name: ZAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-provider
                  key: zai-api-key
                  optional: true
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-provider
                  key: openrouter-api-key
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-db-url
                  key: url
            - name: STORE_MODEL_IN_DB
              value: "True"
            - name: LITELLM_CONFIG_PATH
              value: /etc/litellm/config.yaml
          args:
            - "--config"
            - "/etc/litellm/config.yaml"
            - "--port"
            - "4000"
          # Ready only once the proxy serves: LiteLLM loads for ~15 s after the
          # container starts, and a rollout must not kill the old pod before that.
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
      volumes:
        # config.yaml + the z.ai limit gate callback (ConfigMap litellm-hooks
        # is built from infra/litellm/zai_limit_gate.py by section_litellm).
        - name: config
          projected:
            sources:
              - configMap:
                  name: litellm-config
              - configMap:
                  name: litellm-hooks
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: platform
spec:
  type: NodePort
  selector:
    app: litellm
  ports:
    - name: http
      port: 4000
      nodePort: 30084
