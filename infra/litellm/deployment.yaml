# LiteLLM gateway — single entry point for agent model access (spec §7.8).
# Models: an external metered API (OpenRouter) — the stand has no GPU, so no
# local inference. The alias names are historical and kept stable: the
# acceptance flows (`litellm/qwen3`) and the llm MCP server address them.
#   qwen3      — the executor/agent model: must emit real OpenAI tool_calls.
#   qwen-coder — cheap light model (gateway pings, short completions).
# The key never lives in git: OpenBao `secret/litellm/openrouter` → Secret
# `litellm-provider` (synced by section_litellm) → env OPENROUTER_API_KEY.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: platform
data:
  config.yaml: |
    model_list:
      - model_name: qwen-coder
        litellm_params:
          model: openrouter/deepseek/deepseek-v4.1-flash
          api_key: os.environ/OPENROUTER_API_KEY
      - model_name: qwen3
        litellm_params:
          model: openrouter/z-ai/glm-5.3
          api_key: os.environ/OPENROUTER_API_KEY
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
    litellm_settings:
      drop_params: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-master
                  key: master-key
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-provider
                  key: openrouter-api-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-db-url
                  key: url
            - name: STORE_MODEL_IN_DB
              value: "True"
            - name: LITELLM_CONFIG_PATH
              value: /etc/litellm/config.yaml
          args:
            - "--config"
            - "/etc/litellm/config.yaml"
            - "--port"
            - "4000"
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: platform
spec:
  type: NodePort
  selector:
    app: litellm
  ports:
    - name: http
      port: 4000
      nodePort: 30084
