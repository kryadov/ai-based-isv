# Alloy daemonset: pod logs from /var/log/containers → Loki (labels: namespace, pod, container).
controller:
  type: daemonset
alloy:
  mounts:
    varlog: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  configMap:
    content: |
      logging {
        level = "info"
      }

      local.file_match "pods" {
        path_targets = [
          { "__path__" = "/var/log/containers/*.log" },
        ]
      }

      discovery.relabel "pods" {
        targets = local.file_match.pods.targets
        rule {
          source_labels = ["__path__"]
          regex         = "/var/log/containers/([^_]+)_([^_]+)_([^_]+)\\.log"
          target_label  = "pod"
        }
        rule {
          source_labels = ["__path__"]
          regex         = "/var/log/containers/[^_]+_([^_]+)_.*"
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__path__"]
          regex         = "/var/log/containers/[^_]+_[^_]+_([^_]+)\\.log"
          target_label  = "container"
        }
      }

      loki.source.file "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.platform.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
